<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyFood</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>EasyFood</h1>
    <p>Restaurantes disponíveis na plataforma</p>
  </header>

  <main>
    <section class="card" id="auth-section">
      <div id="auth-logged-out">
        <h2 id="auth-title">Entrar</h2>
        <form id="auth-form">
          <label id="auth-name-field" hidden>
            Nome *
            <input name="name" maxlength="150" placeholder="Seu nome">
          </label>
          <label>
            E-mail *
            <input name="email" type="email" maxlength="150" placeholder="voce@email.com" required>
          </label>
          <label>
            Senha *
            <input name="password" type="password" minlength="6" maxlength="72" required>
          </label>
          <button type="submit" id="auth-submit">Entrar</button>
          <button type="button" id="auth-toggle" class="link-button">Não tem conta? Cadastre-se</button>
          <p id="auth-message" class="message" role="status"></p>
        </form>
      </div>

      <div id="auth-logged-in" class="auth-logged-in" hidden>
        <span>Conectado como <strong id="auth-user"></strong></span>
        <button type="button" id="logout-button" class="link-button">Sair</button>
      </div>
    </section>

    <section class="card">
      <h2>Cadastrar restaurante</h2>
      <p id="restaurant-login-hint" class="hint">Entre com sua conta para cadastrar um restaurante.</p>
      <form id="restaurant-form">
        <label>
          Nome do restaurante *
          <input name="name" maxlength="150" placeholder="Ex.: Burger House" required>
        </label>
        <label>
          Categoria *
          <input name="category" maxlength="100" placeholder="Ex.: Hambúrguer" required>
        </label>
        <label>
          Avaliação (0 a 5)
          <input name="rating" type="number" min="0" max="5" step="0.1" placeholder="Ex.: 4.5">
        </label>
        <button type="submit">Cadastrar restaurante</button>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Restaurantes</h2>
      <ul id="restaurant-list" class="restaurant-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
