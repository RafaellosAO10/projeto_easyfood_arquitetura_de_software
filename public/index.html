<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>EasyFood</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <div class="menu" id="menu" hidden>
      <nav class="menu-panel" aria-label="Menu">
        <a href="#/">Início</a>
        <a href="#/buscar">Buscar</a>
        <a href="#/perfil">Meu perfil e restaurantes</a>
        <a href="#/carrinho">Carrinho</a>
        <button type="button" id="menu-auth"></button>
      </nav>
    </div>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
      <a href="#/" data-tab="inicio"><i class="ti ti-home" aria-hidden="true"></i><span>Início</span></a>
      <a href="#/buscar" data-tab="buscar"><i class="ti ti-search" aria-hidden="true"></i><span>Buscar</span></a>
      <a href="#/pedidos" data-tab="pedidos"><i class="ti ti-receipt" aria-hidden="true"></i><span>Pedidos</span></a>
      <a href="#/favoritos" data-tab="favoritos"><i class="ti ti-heart" aria-hidden="true"></i><span>Favoritos</span></a>
      <a href="#/perfil" data-tab="perfil"><i class="ti ti-user" aria-hidden="true"></i><span>Perfil</span></a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
